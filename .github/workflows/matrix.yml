name: Matrix Demo 
on: workflow_dispatch
jobs:
  build: 
    continue-on-error: true
    strategy:
      #matric allows us to all run all combinations, here 6 jobs in total
      matrix:
        node-version: [12,14,16]
        operating-system: [ubuntu-latest, windows-latest]
        #include allows you to include standalone combinations
        include:
          - node-version: 18
            operating-system: ubuntu-latest
        #exclude allows us to exclude standalone combinations
        exclude:
          - node-version: 12
            operating-system: windows-latest          - 
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get Code
        uses: actions/checkout@v7 
      - name: Install NodeJS 
        uses: actions/setup-node@v7 
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies 
        run: npm ci 
      - name: Build Project
        run: npm run build 


  
  