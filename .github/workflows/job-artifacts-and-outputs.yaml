name:  Job Artfacts & Outputs 
on:
  push:
    branches:
      - 05-Job-Artifacts-and-Outputsa
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Upload Artifact 
        uses: actions/upload-artifact@v7
        with:
          name: dist-files 
          path: |
            dist 
            package.json 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact 
        uses: actions/download-artifact@v8
        with:
          name: dist-files
      - name: Print artifact files
        run: ls
      - name: Deploy
        run: echo "Deploying..."
