name: Website Deployment
on:
  push:
    branches:
      - 07-Controlling-Workflow-and-Job-Execution
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node-modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies 
        if: steps.cache.outcome.cache-hit != 'true'
        run: npm ci
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node-modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies 
        if: steps.cache.outcome.cache-hit != 'true'
        run: npm ci
      - name: Test code
        continue-on-error: true
        id: test-code
        run: npm run test
      - name: Upload test report
        #this step only only if above step is failed and not skipped
        if: failure() && steps.test-code.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node-modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies 
        if: steps.cache.outcome.cache-hit != 'true'
        run: npm ci 
      - name: Build website
        id: build-website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-files
      - name: Output contents
        run: ls
      - name: Deploy
        run: echo "Deploying..."
  report: 
    needs: [lint, deploy]
    #this executes only if dependant jobs fail
    if: failure()
    runs-on: ubuntu-latest 
    steps: 
      - name: Output Information 
        run: |
          echo "Something went wrong"
          echo "${{ toJson(github) }}"
